# Entorno DESARROLLO (backend `expedition-dev`, proyecto `systexploradores-dev`,
# rama `development`). App Hosting combina este archivo con `apphosting.yaml`
# cuando el "nombre de entorno" del backend es `dev`: aqui va SOLO lo que cambia.
#
# Sin este archivo, desarrollo se compilaba con la configuracion de produccion
# (`apphosting.yaml`) y leia y escribia los datos reales de `systexploradores`.
#
# Nada de esto es secreto: la configuracion web de Firebase y la clave publica
# VAPID viajan en el JS del navegador. Los secretos (cuenta de servicio, clave
# privada VAPID, secreto de tareas) estan en Secret Manager de este proyecto.

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCO4zYfPc3B8CKjZ936GNljKzwn0hCAjVY
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: systexploradores-dev.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: systexploradores-dev
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: systexploradores-dev.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: '880469530963'
  - variable: NEXT_PUBLIC_FIREBASE_APPID
    value: 1:880469530963:web:7db4b5d553dc4b933969a6
  # Pareja de WEB_PUSH_VAPID_PRIVATE_KEY de este proyecto (ver src/utils/web-push-key.js).
  - variable: NEXT_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY
    value: BAzalz-U16iEwwfNTL4sK_FzWfst_nGuNmiY_OWTzPUt3BC2dzigvi6IxKM9r0Hb_dhwobVLe_Qhn6uyxQZvimc
  - variable: WEB_PUSH_VAPID_SUBJECT
    value: https://expedition-dev--systexploradores-dev.us-central1.hosted.app
    availability:
      - RUNTIME
