<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00A76F" />
    <title>Sin conexion | Exploradores del Rey</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, "Public Sans", Arial, sans-serif;
        background: #f4f6f8;
        color: #1c252e;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 440px);
        text-align: center;
      }

      img {
        width: 88px;
        height: 88px;
        object-fit: contain;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #637381;
        font-size: 16px;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 28px;
        padding: 0 18px;
        border-radius: 8px;
        color: #ffffff;
        background: #00a76f;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo/logo-single.png" alt="" />
      <h1>Estas sin conexion</h1>
      <p>Cuando vuelva la conexion podras continuar usando la plataforma.</p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
