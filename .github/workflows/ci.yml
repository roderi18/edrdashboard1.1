name: CI

on:
  pull_request:
    branches: [development, qa, main]
  push:
    branches: [development, qa, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Firestore schema
        run: npm run test:firebase-esquema

      - name: Test access control
        run: npm run test:acceso

      - name: Test chat authorization
        run: npm run test:chat-auth

      - name: Test store
        run: npm run test:tienda

      - name: Build application
        run: npm run build

