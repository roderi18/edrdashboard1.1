name: Promotion Gate

on:
  pull_request:
    branches: [qa, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate promotion source
    runs-on: ubuntu-latest
    steps:
      - name: Enforce development to QA to Production
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.base_ref }}"
          head="${{ github.head_ref }}"

          if [[ "$base" == "qa" && "$head" != "development" && "$head" != hotfix/* ]]; then
            echo "QA only accepts development or hotfix/* branches. Received: $head"
            exit 1
          fi

          if [[ "$base" == "main" && "$head" != "qa" ]]; then
            echo "Production only accepts the qa branch. Received: $head"
            exit 1
          fi

          echo "Valid promotion: $head -> $base"

