# Dependabot abre PRs para actualizar librerias. Van contra `development` para
# seguir el flujo development -> qa -> main (promotion-gate.yml); contra `main`
# los rechazaria la promocion.
#
# UNA VEZ AL MES Y UN SOLO PR POR ECOSISTEMA. La primera pasada semanal abrio
# diez PRs de golpe, varios de saltos mayores (react-dropzone 14 -> 20,
# framer-motion 12 -> 14) que pueden romper pantallas. Las versiones mayores se
# ignoran: se hacen a mano, probando. Las vulnerabilidades las sigue avisando
# `npm audit` en seguridad.yml cada lunes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      menores-y-parches:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      acciones:
        patterns: ['*']
